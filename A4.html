<!DOCTYPE html>
<html>
<head>
    <title>Hotel room booking Form</title>
</head>
<body>

    <h2>Hotel room booking Form</h2>

    <form>

        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">
        <br><br>

        <label>Phone:</label>

        <input type="phone" name="Enter your phone number">
        <br><br>

        <label>Check-in Date :</label>
        <input type="date" name="Check in date"> 
        
        <br><br>

       
    
        <label>Check-out Date :</label>
        <input type="date" name="Check-out date ">
        <br><br>

          <label>Room type:</label>
        <select name="room">
            <option>Select room type</option>
            <option>Single room </option>
            <option>Double room</option>
             </select>
                <br><br>


        <label>Number of guests:</label>
        <input type="guests" name="number of guests">
        <br><br>


       
        <label>Special Requests:</label>
        <textarea name="Special requests:" rows="4" cols="30"></textarea>
        <br><br>
        
          <input type="submit" value="Book Now">
        <input type="reset" value="Reset form">



    </form>

</body>

</html>
